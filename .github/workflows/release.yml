name: Automated Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create Release as github-actions[bot]
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --repo "${{ github.repository }}" \
            --title "Classic Video Enhancer $TAG_NAME" \
            --notes "Official standalone Windows (x64) release for Classic Video Enhancer ($TAG_NAME). Verify the SHA-256 checksum on https://coderiotlabs.com before running the installer." \
            --latest